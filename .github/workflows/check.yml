name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/check-secrets.mjs
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
  postgres-authentication:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: jobdiscover_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Apply migrations and verify the complete account lifecycle
        env:
          DATABASE_URL: postgresql://test_runner:disposable-ci-password@localhost:5432/jobdiscover_test
          DATABASE_SSL: "false"
          TEST_DATABASE_URL: postgresql://test_runner:disposable-ci-password@localhost:5432/jobdiscover_test
        run: |
          npm run db:migrate
          npm run test:postgres
        working-directory: web
