name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node scripts/check-secrets.mjs
      - run: npm ci
        working-directory: web
      - run: npm run check
        working-directory: web
  database-isolation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test_runner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: jobdiscover_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify RLS and deletion in disposable PostgreSQL
        env:
          PGPASSWORD: disposable-ci-password
        run: |
          psql -h localhost -U test_runner -d jobdiscover_test -v ON_ERROR_STOP=1 \
            -f web/tests/sql/bootstrap.sql \
            -f web/supabase/migrations/001_private_accounts.sql \
            -f web/supabase/migrations/002_offer_cache.sql \
            -f web/supabase/migrations/003_job_enrichment.sql \
            -f web/tests/sql/isolation.sql
