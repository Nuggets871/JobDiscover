name: check

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: jobdiscover_test
          POSTGRES_USER: jobdiscover
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobdiscover -d jobdiscover_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: make check
      - run: npm run db:migrate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://jobdiscover:test-only-password@127.0.0.1:5432/jobdiscover_test
          DATABASE_SSL: "false"
      - run: npm run test:postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://jobdiscover:test-only-password@127.0.0.1:5432/jobdiscover_test
          DATABASE_SSL: "false"
