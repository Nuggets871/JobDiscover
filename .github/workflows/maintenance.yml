name: Data maintenance
on:
  workflow_dispatch:
  schedule:
    - cron: '5 3 * * *'
permissions: {}
jobs:
  cleanup:
    if: vars.MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Remove expired shared cache entries
        env:
          JOBDISCOVER_ORIGIN: ${{ vars.APP_ORIGIN }}
          JOBDISCOVER_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 --request POST \
            --header "Authorization: Bearer $JOBDISCOVER_CRON_SECRET" \
            "$JOBDISCOVER_ORIGIN/api/maintenance"
