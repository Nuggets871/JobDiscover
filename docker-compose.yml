services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobdiscover_app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PUBLIC_DIR: /app/frontend/dist
      DATABASE_URL: postgresql://${POSTGRES_USER:-jd_user}:${POSTGRES_PASSWORD:-jd_password}@postgres:5432/${POSTGRES_DB:-jobdiscover}
      DATABASE_SSL: "false"
      APP_ORIGIN: https://jobs.christopher-bondier.com
      SESSION_DAYS: ${SESSION_DAYS:-30}
      FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
      FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      AI_PUBLIC_JOB_ENRICHMENT: ${AI_PUBLIC_JOB_ENRICHMENT:-false}
      CRON_SECRET: ${CRON_SECRET}
    networks:
      - internal
      - web
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.jobdiscover.rule=Host(`jobs.christopher-bondier.com`)"
      - "traefik.http.routers.jobdiscover.entrypoints=websecure"
      - "traefik.http.routers.jobdiscover.tls=true"
      - "traefik.http.routers.jobdiscover.tls.certresolver=letsencrypt"
      - "traefik.http.services.jobdiscover.loadbalancer.server.port=3000"

  postgres:
    image: postgres:16
    container_name: jobdiscover_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jd_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobdiscover}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jd_user} -d ${POSTGRES_DB:-jobdiscover}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:

networks:
  internal:
    driver: bridge
  web:
    external: true