services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jobdiscover
      POSTGRES_USER: jobdiscover
      POSTGRES_PASSWORD: local-development-only
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - jobdiscover_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobdiscover -d jobdiscover']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  jobdiscover_postgres: